name: Deploy Staging

# Runs AFTER CI, not alongside it. Both used to fire on `push: main`, so they raced: a commit
# that failed type-check, lint, format or the tests still reached staging, because the deploy job
# never looked at CI's result. That was the last open criterion of #83.
#
# workflow_run only fires for workflows defined on the default branch, which CI is.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Skips the deploy when CI failed or was cancelled. Without this the job would still run —
    # workflow_run fires on completion, not on success.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.neiist.rnl.tecnico.ulisboa.pt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The exact commit CI validated. A workflow_run checkout otherwise defaults to the tip
          # of the default branch, which may already have moved on.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Upload Deployment Script
        run: |
          scp -o StrictHostKeyChecking=no scripts/deploy_staging.sh \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/home/neiist/deploy_staging.sh
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "chmod +x /home/neiist/deploy_staging.sh"

      - name: Deploy to Staging
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "su - neiist -c 'bash ~/deploy_staging.sh'"

      - name: Confirm Staging Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
          "su - neiist -c 'pm2 jlist | jq -r \".[] | select(.name==\\\"neiist_server_staging\\\" or .name==\\\"staging\\\") | \\\"🌿 \\\" + .name + \\\" → \\\" + .pm2_env.status\"'"
